name: ci

# Both branches are green only when their exact expected evidence is observed:
# `broken` must produce 4 failed / 1 passed, while `fixed` must produce 5 passed.
on:
  push:
    branches: [broken, fixed, main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Which branch state is this?
        run: |
          if [ -f db/policies.sql ]; then
            echo "db/policies.sql present -> RLS policies applied -> suite should PASS"
          else
            echo "db/policies.sql absent  -> no RLS -> suite should FAIL, that is the demo"
          fi

      - run: npm run lint

      - run: npm run typecheck

      - name: Verify exact vulnerable or fixed test signature
        run: npm run test:ci
